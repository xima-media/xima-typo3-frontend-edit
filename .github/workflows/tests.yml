name: Tests
on:
  push:
    branches:
      - main
  pull_request: ~

jobs:
  tests:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@48fcbd0657c3818eac74b9d91dc26c29ad76c5ab # 1.0.0
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5", "8.6"]'
      typo3-versions: '["13.4", "14.3"]'
      dependencies: '["highest", "lowest"]'
