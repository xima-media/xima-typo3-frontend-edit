name: OpenSSF Scorecard
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  scorecard:
    uses: konradmichalik/reusable-github-actions/.github/workflows/scorecard.yml@b207c7a6eb8db6c385156a57cdacaaa1c7d3cd0b # 0.2.0
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
