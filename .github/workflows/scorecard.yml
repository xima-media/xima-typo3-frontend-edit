name: OpenSSF Scorecard
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  scorecard:
    uses: konradmichalik/reusable-github-actions/.github/workflows/scorecard.yml@48fcbd0657c3818eac74b9d91dc26c29ad76c5ab # 1.0.0
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
